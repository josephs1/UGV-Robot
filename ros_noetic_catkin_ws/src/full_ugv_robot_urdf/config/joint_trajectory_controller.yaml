# Instead of using TAB for indentation, use two spaces at the place of one TAB

# Controller to control robot arm joints
robot_arm_controller:
  type: "position_controllers/JointTrajectoryController"
  joints: [joint_1, joint_2, joint_3, joint_4, joint_5]

# Controller to control drivetrain joints
drivetrain_controller:
  type: "diff_drive_controller/DiffDriveController"
  left_wheel: ['left_wheel_joint', 'left_front_wheel_joint', 'left_back_wheel_joint']
  right_wheel: ['right_wheel_joint', 'right_front_wheel_joint', 'right_back_wheel_joint']
  publish_rate: 50
  wheel_separation: 0.2286  # Distance between wheels in meters
  wheel_radius: 0.1      # Radius of wheels in meters. Used to be 0.0635
  enable_odom_tf: true
  odom_frame_id: odom
  base_frame_id: root_link
  cmd_vel_timeout: 1.0
  cmd_vel_topic: '/drivetrain_controller/cmd_vel'   # Explicitly define the topic
  pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
  twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
  linear:
    x:
      has_velocity_limits: true
      max_velocity: 30.0
      min_velocity: -30.0

  angular:
    z:
      has_velocity_limits: true
      max_velocity: 30.0
      min_velocity: -30.0
  
# Controller to control end effector joints
hand_ee_controller:
  type: "position_controllers/JointTrajectoryController"
  joints: [ee_thumb_prox_joint, ee_thumb_dist_joint, ee_finger1_roll_joint, ee_finger1_prox_joint, ee_finger1_dist_joint, ee_finger2_roll_joint, ee_finger2_prox_joint, ee_finger2_dist_joint]

# Controller to continuously publish joint states/positions. Rate is in Hz.
joint_state_controller:
  type: "joint_state_controller/JointStateController"
  publish_rate: 50


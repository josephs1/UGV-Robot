controller_list:
  - name: fake_arm_group_controller
    type: $(arg fake_execution_type)
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
  - name: fake_hand_group_controller
    type: $(arg fake_execution_type)
    joints:
      - ee_finger1_roll_joint
      - ee_finger1_prox_joint
      - ee_finger1_dist_joint
      - ee_finger2_roll_joint
      - ee_finger2_prox_joint
      - ee_finger2_dist_joint
      - ee_thumb_prox_joint
      - ee_thumb_dist_joint
initial:  # Define initial robot poses per group
  - group: arm_group
    pose: arm_zero_pose
  - group: hand_group
    pose: hand_open_zeroes
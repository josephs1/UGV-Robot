#This is a moveit controller connecting follow_joint_trajectory controller with JointTrajectoryController

controller_list:
  - name: robot_arm_controller
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
      
  - name: hand_ee_controller
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
    - ee_thumb_prox_joint
    - ee_thumb_dist_joint
    - ee_finger1_roll_joint
    - ee_finger1_prox_joint
    - ee_finger1_dist_joint
    - ee_finger2_roll_joint
    - ee_finger2_prox_joint
    - ee_finger2_dist_joint

